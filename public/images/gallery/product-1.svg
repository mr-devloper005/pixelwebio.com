<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="productBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9ECEF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#45B7D1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#96CEB4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45B7D1;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="highlight">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Studio background -->
  <rect width="800" height="600" fill="url(#productBg)" />
  
  <!-- Product bottle -->
  <g transform="translate(400, 300)">
    <!-- Shadow -->
    <ellipse cx="0" cy="180" rx="80" ry="20" fill="#000000" opacity="0.2" />
    
    <!-- Bottle body -->
    <path d="M -60 -100 L -60 150 Q -60 170 -40 170 L 40 170 Q 60 170 60 150 L 60 -100 Z" fill="url(#bottle)" />
    
    <!-- Bottle neck -->
    <rect x="-25" y="-140" width="50" height="40" fill="#45B7D1" />
    <rect x="-20" y="-160" width="40" height="20" fill="#3498DB" />
    
    <!-- Cap -->
    <ellipse cx="0" cy="-160" rx="20" ry="8" fill="#2C3E50" />
    
    <!-- Label -->
    <rect x="-50" y="-50" width="100" height="120" rx="5" fill="white" opacity="0.9" />
    
    <!-- Brand text on label -->
    <text x="0" y="-20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50" text-anchor="middle">PIXEL</text>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D" text-anchor="middle">Premium</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="10" fill="#95A5A6" text-anchor="middle">Photography</text>
    
    <!-- Highlight/reflection -->
    <ellipse cx="-20" cy="-50" rx="15" ry="40" fill="url(#highlight)" opacity="0.6" />
    
    <!-- Water drops -->
    <ellipse cx="30" cy="-80" rx="4" ry="6" fill="#87CEEB" opacity="0.8" />
    <ellipse cx="45" cy="-60" rx="3" ry="4" fill="#87CEEB" opacity="0.7" />
    <ellipse cx="35" cy="-40" rx="2" ry="3" fill="#87CEEB" opacity="0.6" />
  </g>
  
  <!-- Studio lighting effect -->
  <g opacity="0.3">
    <ellipse cx="200" cy="100" rx="100" ry="50" fill="white" />
    <ellipse cx="600" cy="150" rx="80" ry="40" fill="white" />
  </g>
  
  <!-- Photography frame -->
  <rect x="60" y="60" width="680" height="480" fill="none" stroke="#2C3E50" stroke-width="2" opacity="0.5" rx="5" />
  
  <!-- Camera metadata -->
  <g fill="#2C3E50" opacity="0.7" font-family="monospace" font-size="11">
    <text x="70" y="580">Nikon Z9 • 105mm f/2.8 Macro • ISO 100 • 1/200s • f/11</text>
    <text x="70" y="25">Product Photography • Studio Lighting • 2024</text>
  </g>
</svg>
