<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="portrait1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="light1">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#portrait1)" />
  
  <!-- Portrait subject -->
  <g transform="translate(400, 300)">
    <!-- Backlight effect -->
    <ellipse cx="0" cy="-50" rx="200" ry="250" fill="url(#light1)" opacity="0.6" />
    
    <!-- Silhouette -->
    <ellipse cx="0" cy="0" rx="120" ry="180" fill="#2C3E50" opacity="0.8" />
    
    <!-- Head -->
    <circle cx="0" cy="-120" r="60" fill="#2C3E50" opacity="0.8" />
    
    <!-- Hair detail -->
    <path d="M -60 -150 Q -60 -180 0 -180 Q 60 -180 60 -150 Q 50 -160 0 -165 Q -50 -160 -60 -150" fill="#1A252F" opacity="0.6" />
    
    <!-- Shoulder highlights -->
    <ellipse cx="-40" cy="60" rx="30" ry="20" fill="white" opacity="0.2" />
    <ellipse cx="40" cy="60" rx="30" ry="20" fill="white" opacity="0.2" />
  </g>
  
  <!-- Photography frame effect -->
  <rect x="50" y="50" width="700" height="500" fill="none" stroke="white" stroke-width="4" opacity="0.3" rx="10" />
  
  <!-- Camera metadata overlay -->
  <g fill="white" opacity="0.7" font-family="monospace" font-size="12">
    <text x="60" y="580">Canon EOS R5 • 85mm f/1.4 • ISO 100 • 1/250s</text>
    <text x="60" y="30">Golden Hour Portrait • 2024</text>
  </g>
</svg>
