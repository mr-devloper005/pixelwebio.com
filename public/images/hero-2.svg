<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F093FB;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F5576C;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="url(#grad3)" />
  
  <!-- Portfolio/Gallery illustration -->
  <g transform="translate(700, 450)">
    <!-- Main portfolio frame -->
    <rect x="-200" y="-150" width="400" height="300" rx="15" fill="white" opacity="0.1" />
    <rect x="-180" y="-130" width="360" height="260" rx="10" fill="white" opacity="0.2" />
    
    <!-- Photo grid -->
    <g opacity="0.8">
      <!-- Row 1 -->
      <rect x="-160" y="-120" width="80" height="60" rx="5" fill="#4ECDC4" />
      <rect x="-70" y="-120" width="80" height="60" rx="5" fill="#FF6B6B" />
      <rect x="20" y="-120" width="80" height="60" rx="5" fill="#45B7D1" />
      
      <!-- Row 2 -->
      <rect x="-160" y="-50" width="80" height="60" rx="5" fill="#96CEB4" />
      <rect x="-70" y="-50" width="80" height="60" rx="5" fill="#FECA57" />
      <rect x="20" y="-50" width="80" height="60" rx="5" fill="#FF9FF3" />
      
      <!-- Row 3 -->
      <rect x="-160" y="20" width="80" height="60" rx="5" fill="#54A0FF" />
      <rect x="-70" y="20" width="80" height="60" rx="5" fill="#48DBFB" />
      <rect x="20" y="20" width="80" height="60" rx="5" fill="#0ABDE3" />
    </g>
    
    <!-- Camera icon overlay -->
    <g transform="translate(0, -80)">
      <circle cx="0" cy="0" r="25" fill="white" opacity="0.9" />
      <path d="M -10 -5 L -10 5 L -5 5 L -3 8 L 3 8 L 5 5 L 10 5 L 10 -5 Z" fill="#2C3E50" />
      <circle cx="0" cy="0" r="3" fill="#2C3E50" />
    </g>
  </g>
  
  <!-- Floating elements -->
  <g opacity="0.2">
    <circle cx="150" cy="200" r="30" fill="white" />
    <circle cx="1250" cy="700" r="40" fill="white" />
    <circle cx="300" cy="750" r="25" fill="white" />
    <circle cx="1100" cy="150" r="35" fill="white" />
  </g>
  
  <!-- Text overlay -->
  <text x="700" y="750" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">Creative Portfolio</text>
  <text x="700" y="800" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.7">Showcase Your Best Work</text>
</svg>
