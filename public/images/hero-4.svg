<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8E06CF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#56AB2F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF512F;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#DD2476;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="url(#grad7)" />
  
  <!-- Community/Collaboration illustration -->
  <g transform="translate(700, 450)">
    <!-- Central platform -->
    <circle cx="0" cy="0" r="80" fill="white" opacity="0.2" />
    <circle cx="0" cy="0" r="60" fill="white" opacity="0.3" />
    
    <!-- Camera icon in center -->
    <g transform="scale(1.5)">
      <rect x="-15" y="-10" width="30" height="20" rx="5" fill="#2C3E50" />
      <circle cx="0" cy="0" r="6" fill="#34495E" />
      <circle cx="0" cy="0" r="4" fill="#45B7D1" />
      <rect x="8" y="-5" width="6" height="4" rx="1" fill="#2C3E50" />
    </g>
    
    <!-- User nodes around the platform -->
    <g opacity="0.8">
      <!-- Top -->
      <g transform="translate(0, -180)">
        <circle cx="0" cy="0" r="35" fill="white" opacity="0.3" />
        <circle cx="0" cy="-5" r="8" fill="#FF6B6B" />
        <path d="M -12 5 Q 0 15 12 5" fill="#FF6B6B" />
        <text x="0" y="55" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Photographer</text>
      </g>
      
      <!-- Right -->
      <g transform="translate(180, 0)">
        <circle cx="0" cy="0" r="35" fill="white" opacity="0.3" />
        <circle cx="0" cy="-5" r="8" fill="#4ECDC4" />
        <path d="M -12 5 Q 0 15 12 5" fill="#4ECDC4" />
        <text x="0" y="55" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Designer</text>
      </g>
      
      <!-- Bottom -->
      <g transform="translate(0, 180)">
        <circle cx="0" cy="0" r="35" fill="white" opacity="0.3" />
        <circle cx="0" cy="-5" r="8" fill="#45B7D1" />
        <path d="M -12 5 Q 0 15 12 5" fill="#45B7D1" />
        <text x="0" y="55" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Client</text>
      </g>
      
      <!-- Left -->
      <g transform="translate(-180, 0)">
        <circle cx="0" cy="0" r="35" fill="white" opacity="0.3" />
        <circle cx="0" cy="-5" r="8" fill="#96CEB4" />
        <path d="M -12 5 Q 0 15 12 5" fill="#96CEB4" />
        <text x="0" y="55" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Editor</text>
      </g>
    </g>
    
    <!-- Connection lines -->
    <g stroke="white" stroke-width="2" opacity="0.4">
      <line x1="0" y1="-80" x2="0" y2="-145" />
      <line x1="80" y1="0" x2="145" y2="0" />
      <line x1="0" y1="80" x2="0" y2="145" />
      <line x1="-80" y1="0" x2="-145" y2="0" />
    </g>
    
    <!-- Floating content elements -->
    <g opacity="0.6">
      <!-- Photo previews -->
      <rect x="-250" y="-50" width="40" height="30" rx="3" fill="url(#grad8)" />
      <rect x="210" y="-50" width="40" height="30" rx="3" fill="url(#grad8)" />
      <rect x="-250" y="20" width="40" height="30" rx="3" fill="url(#grad8)" />
      <rect x="210" y="20" width="40" height="30" rx="3" fill="url(#grad8)" />
    </g>
  </g>
  
  <!-- Background decoration -->
  <g opacity="0.2">
    <circle cx="200" cy="200" r="50" fill="white" />
    <circle cx="1200" cy="700" r="60" fill="white" />
    <circle cx="350" cy="750" r="40" fill="white" />
    <circle cx="1050" cy="150" r="45" fill="white" />
  </g>
  
  <!-- Text overlay -->
  <text x="700" y="750" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">Creative Community</text>
  <text x="700" y="800" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.7">Connect & Collaborate</text>
</svg>
