<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarBg)" />
  
  <!-- Person icon -->
  <g transform="translate(100, 100)">
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="white" opacity="0.9" />
    
    <!-- Body -->
    <path d="M -35 15 Q -35 5 -25 5 L 25 5 Q 35 5 35 15 L 35 40 Q 35 50 25 50 L -25 50 Q -35 50 -35 40 Z" fill="white" opacity="0.9" />
  </g>
  
  <!-- User icon overlay -->
  <g transform="translate(100, 100)" opacity="0.3">
    <circle cx="0" cy="-20" r="20" fill="none" stroke="white" stroke-width="2" />
    <path d="M -30 15 Q -30 0 -15 0 L 15 0 Q 30 0 30 15 L 30 45 Q 30 60 15 60 L -15 60 Q -30 60 -30 45 Z" fill="none" stroke="white" stroke-width="2" />
  </g>
</svg>
