<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FA709A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEE140;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg2)" />
  
  <!-- Person illustration -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="45" fill="#FDBCB4" />
    
    <!-- Hair (longer for female) -->
    <path d="M -45 -60 Q -45 -90 0 -90 Q 45 -90 45 -60 L 45 -20 Q 40 -10 35 -5 L 35 20 Q 30 30 20 35 L -20 35 Q -30 30 -35 20 L -35 -5 Q -40 -10 -45 -20 Z" fill="#8B4513" />
    
    <!-- Eyes -->
    <circle cx="-15" cy="-40" r="3" fill="#2C3E50" />
    <circle cx="15" cy="-40" r="3" fill="#2C3E50" />
    
    <!-- Smile -->
    <path d="M -15 -25 Q 0 -15 15 -25" stroke="#2C3E50" stroke-width="2" fill="none" />
    
    <!-- Body -->
    <rect x="-60" y="10" width="120" height="100" rx="10" fill="#E74C3C" />
    
    <!-- Design tools icons on shirt -->
    <g transform="scale(0.6)">
      <!-- Palette -->
      <circle cx="-20" cy="0" r="12" fill="white" opacity="0.8" />
      <circle cx="-24" cy="-4" r="2" fill="#FF6B6B" />
      <circle cx="-16" cy="-4" r="2" fill="#4ECDC4" />
      <circle cx="-20" cy="4" r="2" fill="#45B7D1" />
      
      <!-- Pen tool -->
      <rect x="15" y="-15" width="4" height="30" rx="2" fill="white" opacity="0.8" />
      <polygon points="17,-20 15,-15 19,-15" fill="white" opacity="0.8" />
    </g>
  </g>
  
  <!-- Name and role -->
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Priya Mehta</text>
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.9">Head of Design</text>
</svg>
