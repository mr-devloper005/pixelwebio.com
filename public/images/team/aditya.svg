<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1)" />
  
  <!-- Person illustration -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="45" fill="#FDBCB4" />
    
    <!-- Hair -->
    <path d="M -45 -60 Q -45 -85 0 -85 Q 45 -85 45 -60 Q 40 -70 0 -75 Q -40 -70 -45 -60" fill="#2C3E50" />
    
    <!-- Eyes -->
    <circle cx="-15" cy="-40" r="3" fill="#2C3E50" />
    <circle cx="15" cy="-40" r="3" fill="#2C3E50" />
    
    <!-- Smile -->
    <path d="M -15 -25 Q 0 -15 15 -25" stroke="#2C3E50" stroke-width="2" fill="none" />
    
    <!-- Body -->
    <rect x="-60" y="10" width="120" height="100" rx="10" fill="#3498DB" />
    
    <!-- Camera logo on shirt -->
    <g transform="scale(0.8)">
      <rect x="-15" y="-8" width="30" height="20" rx="5" fill="white" opacity="0.8" />
      <circle cx="0" cy="0" r="6" fill="#2C3E50" opacity="0.8" />
      <circle cx="0" cy="0" r="4" fill="#3498DB" opacity="0.8" />
    </g>
  </g>
  
  <!-- Name and role -->
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Aditya Sharma</text>
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.9">Founder & CEO</text>
</svg>
