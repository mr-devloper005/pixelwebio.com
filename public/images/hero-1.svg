<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#45B7D1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#96CEB4;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="url(#grad1)" />
  
  <!-- Camera illustration -->
  <g transform="translate(700, 450)">
    <!-- Camera body -->
    <rect x="-120" y="-80" width="240" height="160" rx="20" fill="#2C3E50" />
    <rect x="-100" y="-60" width="200" height="120" rx="15" fill="#34495E" />
    
    <!-- Lens -->
    <circle cx="0" cy="0" r="60" fill="#1A252F" />
    <circle cx="0" cy="0" r="50" fill="#2C3E50" />
    <circle cx="0" cy="0" r="35" fill="#34495E" />
    <circle cx="0" cy="0" r="25" fill="#45B7D1" opacity="0.8" />
    
    <!-- Viewfinder -->
    <rect x="60" y="-30" width="40" height="30" rx="5" fill="#1A252F" />
    <rect x="65" y="-25" width="30" height="20" rx="3" fill="#45B7D1" opacity="0.6" />
    
    <!-- Shutter button -->
    <circle cx="80" cy="40" r="12" fill="#E74C3C" />
    <circle cx="80" cy="40" r="8" fill="#C0392B" />
  </g>
  
  <!-- Photography elements -->
  <g opacity="0.3">
    <!-- Photo frames -->
    <rect x="100" y="100" width="150" height="100" rx="5" fill="white" opacity="0.2" />
    <rect x="1150" y="700" width="150" height="100" rx="5" fill="white" opacity="0.2" />
    <rect x="200" y="650" width="120" height="80" rx="5" fill="white" opacity="0.15" />
    <rect x="1050" y="150" width="120" height="80" rx="5" fill="white" opacity="0.15" />
  </g>
  
  <!-- Text overlay -->
  <text x="700" y="750" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">Pixelwebio</text>
  <text x="700" y="800" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.7">Professional Photography Platform</text>
</svg>
